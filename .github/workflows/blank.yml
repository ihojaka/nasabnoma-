name: Build AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build AAB
        run: |
          unzip -o '*.zip' -d . || true
          DIR=$(find . -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "DIR=$DIR"
          cd $DIR
          # keystore
          keytool -genkey -v -keystore /tmp/my.keystore -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -alias upload -keypass 123456 -dname "CN=Nasabnoma"
          chmod +x gradlew
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=/tmp/my.keystore -Pandroid.injected.signing.store.password=123456 -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password=123456 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nasabnoma-aab
          path: "**/app/build/outputs/bundle/release/*.aab"
