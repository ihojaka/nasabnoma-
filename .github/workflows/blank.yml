name: Build AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Build AAB
        run: |
          unzip -o '*.zip' -d .
          DIR=$(find . -name "gradlew" | head -n 1 | xargs dirname)
          echo "DIR=$DIR"
          cd $DIR
          # keystore
          keytool -genkey -v -keystore my-release-key.keystore -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Test"
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: '**/*.aab'
